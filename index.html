<!DOCTYPE html>
<html>
<head>
  <title>Writing Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f7fb;
      margin: 0;
      padding: 0;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 30px;
    }

    h1 {
      font-size: 40px;
    }

    .box {
      background: white;
      margin: 30px auto;
      padding: 20px;
      width: 80%;
      border-radius: 15px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Welcome to Writing Hub</h1>
  <p>Improve your writing skills step by step</p>
</header>

<div class="box">
  <h2>✍️ Writing Practice</h2>
  <p>Write essays, improve your vocabulary and learn new ideas.</p>
  <button>Start Writing</button>
</div>

<div class="box">
  <h2>📚 Learning Resources</h2>
  <p>Grammar, vocabulary and useful writing tips.</p>
</div>

<div class="box">
  <h2>🌟 About Writing Hub</h2>
  <p>A platform for students who want to become better writers.</p>
</div>

</body>
</html>
